services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "18081:18081"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg17
    # 5433 on the host: a host-level Postgres already owns 127.0.0.1:5432 and
    # shadows the container, so the app would connect to the wrong cluster.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: seeyou
      POSTGRES_USER: seeyou
      POSTGRES_PASSWORD: seeyou_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeyou -d seeyou -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  surrealdb:
    # Must stay on the v3 line: the Rust SDK is surrealdb 3.0.2 and a v2 server
    # rejects the v3 protocol, which silently disables every /graph endpoint.
    image: surrealdb/surrealdb:v3.2
    user: "0:0"
    # v3 dropped the `file://` scheme; rocksdb is its replacement for local storage.
    command: start --user root --pass root rocksdb:/data/surreal.db
    ports:
      - "8000:8000"
    volumes:
      - surreal-data:/data

volumes:
  redpanda-data:
  redis-data:
  pgdata:
  surreal-data:
